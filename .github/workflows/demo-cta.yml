name: demo-cta
on:
  push:
    branches: [chore/demo-cta]
    paths:
      - '.github/workflows/demo-cta.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply and commit
        run: |
          echo '' | base64 -d > /tmp/demo_cta.py
          python3 /tmp/demo_cta.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -qf .github/workflows/demo-cta.yml
          git commit -m "Replace 14-day trial CTAs with Book a Demo linking to contact"
          git push
