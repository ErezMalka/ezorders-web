name: CI

# Runs on every PR into main and on pushes to main.
#
# Least privilege: the whole workflow is read-only. No job here needs to write to
# the repository, and a content pipeline that opens automated PRs must never hold
# a token that could merge or push.
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Fast structural gate. Runs first and in seconds, so the common content
  # mistakes fail before anyone pays for an install + production build.
  # -------------------------------------------------------------------------
  content:
    name: Content schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependencies needed: the validator is dependency-free by design.
      - name: Validate article structure, slugs, alt text and secrets
        run: node scripts/validate-content.mjs

  # -------------------------------------------------------------------------
  # Lint, typecheck, and a real production build. The build is the authoritative
  # content gate: it runs the typed schema in src/lib/content/schema.ts, so any
  # article violating a length limit, a duplicate slug, or a missing field fails
  # here with an actionable message.
  # -------------------------------------------------------------------------
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    needs: content
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      # The sitemap is generated by the build; if it did not emit, article URLs
      # would silently never be indexed.
      - name: Assert sitemap was generated
        run: |
          if [ ! -f .next/server/app/sitemap.xml.body ] && [ ! -d .next/server/app ]; then
            echo "::error::Build did not produce a sitemap route output"
            exit 1
          fi
          echo "Sitemap route present."

  # -------------------------------------------------------------------------
  # Secret scan across the whole tree. This repository is PUBLIC, so this is a
  # standing gate rather than a content-pipeline nicety.
  # -------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for credential patterns
        run: |
          set -o pipefail
          PATTERN='sk-ant-[A-Za-z0-9_-]{10,}|\b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}|\bgithub_pat_[A-Za-z0-9_]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}'
          if grep -rInE "$PATTERN" \
               --exclude-dir=.git \
               --exclude-dir=node_modules \
               --exclude-dir=.next \
               . ; then
            echo "::error::Potential credential found. This repository is PUBLIC."
            exit 1
          fi
          echo "No credential patterns found."

      - name: Assert .env files are not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked in git"
            exit 1
          fi
          echo ".env is not tracked."
