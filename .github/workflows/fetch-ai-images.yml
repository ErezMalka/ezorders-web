name: fetch-ai-images

on:
  push:
    branches: [feature/he-seo-images]
    paths: ['.github/workflows/fetch-ai-images.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download marketing images
        run: |
          set -e
          mkdir -p public/images/ai
          B="https://d8j0ntlcm91z4.cloudfront.net/user_3D2BfXSZEr8iJa6dZDctze2PBVp/hf_"
          curl -fSL "${B}20260718_080943_bdc0428d-d39e-48f8-8221-f4a0bca3e5d4.png" -o public/images/ai/ezorders-hero-restaurant-scene.png
          curl -fSL "${B}20260717_205622_186639f7-40d4-479c-984d-edf7f192072a.png" -o public/images/ai/ezorders-mobile-ordering-app.png
          curl -fSL "${B}20260717_205354_7d4c5fc2-a3c5-4a80-af1d-00e762e863f2.png" -o public/images/ai/ezorders-qr-table-ordering.png
          curl -fSL "${B}20260717_195110_db7eb658-f08d-4c16-9876-f95eef590ed0.png" -o public/images/ai/ezorders-self-service-kiosk.png
          curl -fSL "${B}20260717_202902_116f523c-c91b-4407-b375-f53df793b5d7.png" -o public/images/ai/ezorders-pos-system.png
          curl -fSL "${B}20260717_203644_7b61bae7-b10c-464f-ba60-ec94931c72b0.png" -o public/images/ai/ezorders-analytics-dashboard.png
          curl -fSL "${B}20260717_202408_a626b67d-5ef0-4810-ab25-11b509209f35.png" -o public/images/ai/ezorders-kitchen-display-kds.png
          curl -fSL "${B}20260717_200041_ae0fdcf3-f057-4a94-8dca-5241cde45498.png" -o public/images/ai/ezorders-order-status-board.png
          curl -fSL "${B}20260717_203137_7e49d480-66a5-4017-ac2b-c72349dc88a5.png" -o public/images/ai/ezorders-online-ordering-laptop.png
          curl -fSL "${B}20260717_193805_1e38224e-4d1b-4e72-93df-cb95df8207a8.png" -o public/images/ai/ezorders-contactless-payment.png
          ls -la public/images/ai/
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/ai
          git commit -m "Add AI marketing images (10 PNGs) via one-off workflow"
          git push
